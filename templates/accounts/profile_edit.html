


{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<h1>Edit Profile</h1>

<form method="post">

    {% csrf_token %}

    <div class="form-group">
        <label>First Name</label>
        <input
            type="text"
            name="first_name"
            value="{{ user.first_name }}"
        >
    </div>

    <div class="form-group">
        <label>Last Name</label>
        <input
            type="text"
            name="last_name"
            value="{{ user.last_name }}"
        >
    </div>

    <div class="form-group">
        <label>Phone Number</label>
        <input
            type="text"
            name="phone_number"
            value="{{ user.phone_number }}"
        >
    </div>

    <button
        type="submit"
        class="btn btn-primary"
    >
        Save Changes
    </button>

    <a
        href="{% url 'accounts:profile' %}"
        class="btn btn-secondary"
    >
        Cancel
    </a>

</form>

{% endblock %}
