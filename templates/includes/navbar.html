


<nav class="border-bottom bg-white">

    <div class="container">

        <div class="d-flex justify-between align-center py-3">

            <!-- ============================================== -->
            <!-- Brand -->
            <!-- ============================================== -->

            <a href="{% url 'home' %}"
               class="text-decoration-none">

                <strong>AI Ecommerce</strong>

            </a>

            <!-- ============================================== -->
            <!-- Main Navigation -->
            <!-- ============================================== -->

            <ul class="d-flex gap-3 list-unstyled">

                <li>
                    <a href="{% url 'home' %}">
                        Home
                    </a>
                </li>

                <li>
                    <a href="{% url 'products:list' %}">
                        Products
                    </a>
                </li>

                <li>
                    <a href="{% url 'shops:shop_list' %}">
                        Shops
                    </a>
                </li>

            </ul>

            <!-- ============================================== -->
            <!-- Search -->
            <!-- ============================================== -->

            <form action="{% url 'products:list' %}"
                  method="get"
                  class="d-flex">

                <input
                    type="search"
                    name="q"
                    placeholder="Search products..."
                >

                <button type="submit">
                    Search
                </button>

            </form>

            <!-- ============================================== -->
            <!-- Right Side -->
            <!-- ============================================== -->

            <div class="d-flex align-center gap-2">

                <a href="{% url 'cart:cart_detail' %}">
                    Cart
                    {% if cart_count %}
                        ({{ cart_count }})
                    {% endif %}
                </a>

                {% if user.is_authenticated %}

                    <a href="{% url 'accounts:profile' %}">
                        {{ user.username }}
                    </a>

                    <a href="{% url 'accounts:logout' %}">
                        Logout
                    </a>

                {% else %}

                    <a href="{% url 'accounts:login' %}">
                        Login
                    </a>

                    <a href="{% url 'accounts:register' %}">
                        Register
                    </a>

                {% endif %}

            </div>

        </div>

    </div>

</nav>
