


<article class="border rounded shadow-sm p-3 h-100">

    <!-- ============================================== -->
    <!-- Product Image -->
    <!-- ============================================== -->

    <a href="{{ product.get_absolute_url }}">

        {% if product.image %}

            <img
                src="{{ product.image.url }}"
                alt="{{ product.name }}"
                class="w-100"
            >

        {% else %}

            <div class="text-center py-5 border">

                No Image

            </div>

        {% endif %}

    </a>

    <!-- ============================================== -->
    <!-- Product Information -->
    <!-- ============================================== -->

    <div class="mt-3">

        <h3>

            <a href="{{ product.get_absolute_url }}">

                {{ product.name }}

            </a>

        </h3>

        {% if product.category %}

            <p>

                {{ product.category.name }}

            </p>

        {% endif %}

    </div>

    <!-- ============================================== -->
    <!-- Price -->
    <!-- ============================================== -->

    <div class="mt-2">

        {% if product.discount_price %}

            <p>

                <del>

                    ${{ product.price }}

                </del>

            </p>

            <strong>

                ${{ product.discount_price }}

            </strong>

        {% else %}

            <strong>

                ${{ product.price }}

            </strong>

        {% endif %}

    </div>

    <!-- ============================================== -->
    <!-- View Product -->
    <!-- ============================================== -->

    <div class="mt-3">

        <a
            href="{{ product.get_absolute_url }}"
            class="btn"
        >

            View Product

        </a>

    </div>

</article>
