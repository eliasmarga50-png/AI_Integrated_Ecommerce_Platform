


<article class="border rounded shadow-sm p-3 h-100">

    <!-- ============================================== -->
    <!-- Product Image -->
    <!-- ============================================== -->

    <a href="{% url 'products:detail' product.slug %}">

        {% if product.image %}

            <img
                src="{{ product.image.url }}"
                alt="{{ product.name }}"
                class="w-100"
            >

        {% else %}

            <div class="text-center py-5 border">

                No Image

            </div>

        {% endif %}

    </a>

    <!-- ============================================== -->
    <!-- Product Information -->
    <!-- ============================================== -->

    <div class="mt-3">

        <h3>

            <a href="{% url 'products:detail' product.slug %}">

                {{ product.name }}

            </a>

        </h3>

        {% if product.category %}

            <p>

                {{ product.category.name }}

            </p>

        {% endif %}

    </div>

    <!-- ============================================== -->
    <!-- Price -->
    <!-- ============================================== -->

    <div class="mt-2">

    <strong>
        {{ product.price }} {{ product.currency|default:"ETB" }}
    </strong>

</div>

    <!-- ============================================== -->
    <!-- View Product -->
    <!-- ============================================== -->

    <div class="mt-3">

        <a href="{% url 'products:detail' product.slug %}">

            View Product

        </a>

    </div>

</article>
