


<article class="border rounded shadow-sm p-3 h-100">

    <!-- ============================================== -->
    <!-- Shop Logo -->
    <!-- ============================================== -->

    <a href="{{ shop.get_absolute_url }}">

        {% if shop.logo %}

            <img
                src="{{ shop.logo.url }}"
                alt="{{ shop.name }}"
                class="w-100"
            >

        {% else %}

            <div class="text-center py-5 border">

                No Logo

            </div>

        {% endif %}

    </a>

    <!-- ============================================== -->
    <!-- Shop Information -->
    <!-- ============================================== -->

    <div class="mt-3">

        <h3>

            <a href="{{ shop.get_absolute_url }}">

                {{ shop.name }}

            </a>

        </h3>

        {% if shop.description %}

            <p>

                {{ shop.description|truncatewords:20 }}

            </p>

        {% endif %}

    </div>

    <!-- ============================================== -->
    <!-- Shop Details -->
    <!-- ============================================== -->

    <div class="mt-2">

        <p>

            <strong>Owner:</strong>

            {{ shop.owner.username }}

        </p>

        <p>

            <strong>Products:</strong>

            {{ shop.product_count|default:"0" }}

        </p>

    </div>

    <!-- ============================================== -->
    <!-- Visit Shop -->
    <!-- ============================================== -->

    <div class="mt-3">

        <a
            href="{{ shop.get_absolute_url }}"
            class="btn"
        >

            Visit Shop

        </a>

    </div>

</article>
