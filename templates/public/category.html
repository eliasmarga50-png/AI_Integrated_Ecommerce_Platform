


<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Basic Page Information
    =========================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Category | AI Ecommerce</title>

    <meta name="description"
        content="Browse products within a specific category on AI Ecommerce.">

    <meta name="keywords"
        content="Category, Products, Marketplace, Shopping">

    <meta name="author" content="AI Ecommerce">

    <!-- ==========================================
         Favicon
    =========================================== -->
    <link rel="icon" href="../static/images/favicon.ico">

    <!-- ==========================================
         Base CSS
    =========================================== -->
    <link rel="stylesheet" href="../static/css/base/reset.css">
    <link rel="stylesheet" href="../static/css/base/variables.css">
    <link rel="stylesheet" href="../static/css/base/typography.css">

    <!-- ==========================================
         Layout CSS
    =========================================== -->
    <link rel="stylesheet" href="../static/css/layout/layout.css">
    <link rel="stylesheet" href="../static/css/layout/grid.css">
    <link rel="stylesheet" href="../static/css/layout/responsive.css">

    <!-- ==========================================
         Component CSS
    =========================================== -->
    <link rel="stylesheet" href="../static/css/components/buttons.css">
    <link rel="stylesheet" href="../static/css/components/cards.css">
    <link rel="stylesheet" href="../static/css/components/forms.css">
    <link rel="stylesheet" href="../static/css/components/badges.css">
    <link rel="stylesheet" href="../static/css/components/tables.css">
    <link rel="stylesheet" href="../static/css/components/alerts.css">
    <link rel="stylesheet" href="../static/css/components/modals.css">

    <!-- ==========================================
         Utility CSS
    =========================================== -->
    <link rel="stylesheet" href="../static/css/utilities/spacing.css">
    <link rel="stylesheet" href="../static/css/utilities/display.css">
    <link rel="stylesheet" href="../static/css/utilities/flex.css">
    <link rel="stylesheet" href="../static/css/utilities/text.css">
    <link rel="stylesheet" href="../static/css/utilities/colors.css">
    <link rel="stylesheet" href="../static/css/utilities/borders.css">
    <link rel="stylesheet" href="../static/css/utilities/shadows.css">
    <link rel="stylesheet" href="../static/css/utilities/visibility.css">

    <!-- ==========================================
         Page CSS
    =========================================== -->
    <link rel="stylesheet" href="../static/css/pages/category.css">

</head>

<body>

    <!-- ==========================================
         Header
    =========================================== -->
    <header id="site-header">
        <!-- Navigation -->
    </header>

    <!-- ==========================================
         Main Content
    =========================================== -->
    <main>

        <!-- Breadcrumb -->
        <section id="breadcrumb">
        </section>

        <!-- Category Hero -->
        <section id="category-header">

            <section id="category-banner">
            </section>

            <section id="category-information">

                <section id="category-name">
                </section>

                <section id="category-description">
                </section>

                <section id="category-statistics">
                </section>

            </section>

        </section>

        <!-- Category Layout -->
        <section id="category-layout">

            <!-- Sidebar -->
            <aside id="category-sidebar">

                <section id="subcategories">
                </section>

                <section id="price-filter">
                </section>

                <section id="brand-filter">
                </section>

                <section id="rating-filter">
                </section>

                <section id="availability-filter">
                </section>

            </aside>

            <!-- Products -->
            <section id="category-products">

                <section id="category-toolbar">
                </section>

                <section id="product-grid">
                </section>

                <section id="pagination">
                </section>

            </section>

        </section>

        <!-- Featured Products -->
        <section id="featured-category-products">
        </section>

        <!-- Popular Brands -->
        <section id="popular-brands">
        </section>

        <!-- Related Categories -->
        <section id="related-categories">
        </section>

    </main>

    <!-- ==========================================
         Footer
    =========================================== -->
    <footer id="site-footer">
    </footer>

    <!-- ==========================================
         JavaScript
    =========================================== -->
    <script src="../static/js/navbar.js"></script>
    <script src="../static/js/search.js"></script>
    <script src="../static/js/app.js"></script>

</body>

</html>
