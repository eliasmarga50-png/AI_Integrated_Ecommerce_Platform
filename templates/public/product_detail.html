


<!DOCTYPE html>

         Basic Page Information
    =========================================== -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="AI Ecommerce">

    <!-- ==========================================

    <!-- ==========================================

    =========================================== -->

    <link rel="stylesheet" href="../static/css/base/typography.css">

    <!-- ==========================================

    =========================================== -->
    <link rel="stylesheet" href="../static/css/layout/layout.css">
    <link rel="stylesheet" href="../static/css/layout/grid.css">
    <link rel="stylesheet" href="../static/css/layout/responsive.css">

    <!-- ==========================================
         Component CSS
    =========================================== -->
    <link rel="stylesheet" href="../static/css/components/buttons.css">
    <link rel="stylesheet" href="../static/css/components/cards.css">
    <link rel="stylesheet" href="../static/css/components/forms.css">
    <link rel="stylesheet" href="../static/css/components/badges.css">
    <link rel="stylesheet" href="../static/css/components/tables.css">
    <link rel="stylesheet" href="../static/css/components/alerts.css">
    <link rel="stylesheet" href="../static/css/components/modals.css">

    <!-- ==========================================

    <link rel="stylesheet" href="../static/css/utilities/spacing.css">
    <link rel="stylesheet" href="../static/css/utilities/display.css">

    <link rel="stylesheet" href="../static/css/utilities/colors.css">
    <link rel="stylesheet" href="../static/css/utilities/borders.css">
    <link rel="stylesheet" href="../static/css/utilities/shadows.css">
    <link rel="stylesheet" href="../static/css/utilities/visibility.css">

    =========================================== -->
    <link rel="stylesheet" href="../static/css/pages/product_detail.css">

<body>

    <!-- ==========================================
         Header
    =========================================== -->
    <header id="site-header">
        <!-- Navigation -->
    </header>

    <!-- ==========================================
         Main Content
    =========================================== -->
    <main>

        <!-- Breadcrumb -->
        <section id="breadcrumb">
        </section>

        <!-- Product Information -->
        <section id="product-detail">

            <!-- Product Images -->
            <section id="product-gallery">

                <section id="main-image">
                </section>

                <section id="image-thumbnails">
                </section>

            </section>

            <!-- Product Summary -->
            <section id="product-summary">

                <section id="product-title">
                </section>

                <section id="product-rating">
                </section>

                <section id="product-price">
                </section>

                <section id="product-short-description">
                </section>

                <section id="product-availability">
                </section>

                <section id="product-quantity">
                </section>

                <section id="product-actions">
                </section>

                <section id="wishlist-share">
                </section>

            </section>

        </section>

        <!-- Product Tabs -->
        <section id="product-tabs">

            <section id="description-tab">
            </section>

            <section id="specifications-tab">
            </section>

            <section id="reviews-tab">
            </section>

            <section id="shipping-tab">
            </section>

        </section>

        <!-- Seller Information -->
        <section id="seller-information">
        </section>

        <!-- Related Products -->
        <section id="related-products">
        </section>

        <!-- Recently Viewed -->
        <section id="recently-viewed">
        </section>

    </main>

    <!-- ==========================================
         Footer
    =========================================== -->
    <footer id="site-footer">
    </footer>

    <!-- ==========================================
         JavaScript
    =========================================== -->
    <script src="../static/js/navbar.js"></script>
